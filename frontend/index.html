<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LM STAC Streamer – Terrain Hillshade</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        #map { height: 100vh; }
        .controls {
            position: absolute;
            top: 10px; right: 10px;
            z-index: 1000;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            max-width: 300px;
            font-size: 14px;
        }
        .controls h3 { margin-bottom: 10px; font-size: 16px; }
        .controls p { margin: 8px 0; line-height: 1.5; }
        .status { color: #666; }
        .error { color: #d32f2f; }
        .loading { color: #1976d2; font-weight: 500; }
    </style>
</head>
<body>
    <div id="map"></div>

    <div class="controls">
        <h3>Terrain Hillshade</h3>
        <p class="status">
            Draw a box on the map to fetch elevation data.<br/>
            The hillshade will compute automatically.
        </p>
        <div id="feedback" class="status"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>

    <script>
        const map = L.map('map').setView([59.33, 18.07], 10); // Stockholm

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap',
            maxZoom: 19,
            opacity: 0.3
        }).addTo(map);

        // Hillshade layer
        const hillshadeLayer = L.tileLayer('', { opacity: 0.8 }).addTo(map);
        let currentBbox = null;

        // Draw control
        const drawnItems = new L.FeatureGroup();
        map.addLayer(drawnItems);

        const drawControl = new L.Control.Draw({
            draw: { polygon: false, polyline: false, circle: false, circlemarker: false },
            edit: false
        });
        map.addControl(drawControl);

        // Handle drawn rectangles
        map.on('draw:created', async (e) => {
            drawnItems.clearLayers();
            drawnItems.addLayer(e.layer);

            const bounds = e.layer.getBounds();
            currentBbox = [bounds.getWest(), bounds.getSouth(), bounds.getEast(), bounds.getNorth()];

            await fetchHillshade(currentBbox);
        });

        async function fetchHillshade(bbox) {
            const feedback = document.getElementById('feedback');
            feedback.innerHTML = '<span class="loading">⏳ Computing hillshade...</span>';

            try {
                const [minx, miny, maxx, maxy] = bbox;
                const url = `/api/hillshade?minx=${minx}&miny=${miny}&maxx=${maxx}&maxy=${maxy}&demo=true&t=${Date.now()}`;

                // Load as data URL to avoid CORS
                const response = await fetch(url);
                if (!response.ok) throw new Error(`API error: ${response.status}`);

                const blob = await response.blob();
                const dataUrl = URL.createObjectURL(blob);

                // Create a custom tile layer from the image bounds
                const bounds = L.latLngBounds(
                    [[miny, minx], [maxy, maxx]]
                );

                hillshadeLayer.setUrl('');
                L.imageOverlay(dataUrl, bounds, { opacity: 0.8 }).addTo(map);

                feedback.innerHTML = '<span class="status">✓ Hillshade loaded</span>';
            } catch (err) {
                feedback.innerHTML = `<span class="error">Error: ${err.message}</span>`;
            }
        }

        // Also fetch on map interactions (optional auto-fetch on pan)
        let autoFetchTimeout;
        map.on('moveend', () => {
            clearTimeout(autoFetchTimeout);
            autoFetchTimeout = setTimeout(() => {
                if (!currentBbox) {
                    const bounds = map.getBounds();
                    currentBbox = [bounds.getWest(), bounds.getSouth(), bounds.getEast(), bounds.getNorth()];
                    fetchHillshade(currentBbox);
                }
            }, 1000);
        });
    </script>
</body>
</html>
